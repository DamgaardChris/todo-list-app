<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --accent: #4f46e5;
        --accent-dark: #4338ca;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: min(100%, 600px);
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(79, 70, 229, 0.12);
        padding: 28px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 2rem;
        text-align: center;
      }

      .input-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }

      input[type="text"] {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease;
      }

      input[type="text"]:focus {
        border-color: var(--accent);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .add-btn {
        background: var(--accent);
        color: white;
        font-weight: bold;
      }

      .add-btn:hover {
        background: var(--accent-dark);
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-btn,
      .clear-btn {
        background: #eef2ff;
        color: var(--text);
        padding: 8px 12px;
      }

      .filter-btn.active {
        background: var(--accent);
        color: white;
      }

      .clear-btn {
        background: #fff1f2;
        color: #be123c;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
      }

      .task-main {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }

      .task-check {
        width: 20px;
        height: 20px;
        accent-color: var(--success);
        cursor: pointer;
      }

      .task-text {
        word-break: break-word;
      }

      .task-text.completed {
        text-decoration: line-through;
        color: var(--muted);
      }

      .delete-btn {
        background: #fee2e2;
        color: #b91c1c;
        padding: 8px 10px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 24px 12px;
        border: 1px dashed var(--border);
        border-radius: 12px;
      }

      @media (max-width: 520px) {
        .input-row,
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .input-row button,
        .filters button,
        .clear-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>To-Do List</h1>

      <div class="input-row">
        <input id="taskInput" type="text" placeholder="Add a new task..." maxlength="200" />
        <button class="add-btn" id="addBtn">Add</button>
      </div>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <button class="clear-btn" id="clearCompletedBtn">Clear completed</button>
      </div>

      <ul id="todoList"></ul>
    </div>

    <script>
      const STORAGE_KEY = 'todo-list-items-v1';
      const taskInput = document.getElementById('taskInput');
      const addBtn = document.getElementById('addBtn');
      const todoList = document.getElementById('todoList');
      const filterButtons = document.querySelectorAll('.filter-btn');
      const clearCompletedBtn = document.getElementById('clearCompletedBtn');

      let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      let currentFilter = 'all';

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function renderTasks() {
        const filteredTasks = tasks.filter(task => {
          if (currentFilter === 'active') return !task.completed;
          if (currentFilter === 'completed') return task.completed;
          return true;
        });

        todoList.innerHTML = '';

        if (filteredTasks.length === 0) {
          const emptyItem = document.createElement('li');
          emptyItem.className = 'empty';
          emptyItem.textContent = currentFilter === 'all'
            ? 'No tasks yet. Add one above!'
            : currentFilter === 'active'
              ? 'No active tasks.'
              : 'No completed tasks.';
          todoList.appendChild(emptyItem);
          return;
        }

        filteredTasks.forEach(task => {
          const li = document.createElement('li');
          li.innerHTML = `
            <div class="task-main">
              <input class="task-check" type="checkbox" ${task.completed ? 'checked' : ''} data-id="${task.id}" />
              <span class="task-text ${task.completed ? 'completed' : ''}">${escapeHtml(task.text)}</span>
            </div>
            <button class="delete-btn" data-id="${task.id}">Delete</button>
          `;
          todoList.appendChild(li);
        });
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function addTask() {
        const text = taskInput.value.trim();

        if (!text) {
          taskInput.focus();
          return;
        }

        tasks.unshift({
          id: Date.now(),
          text,
          completed: false
        });

        taskInput.value = '';
        taskInput.focus();
        saveTasks();
        renderTasks();
      }

      function toggleTask(taskId) {
        tasks = tasks.map(task =>
          task.id === taskId ? { ...task, completed: !task.completed } : task
        );
        saveTasks();
        renderTasks();
      }

      function deleteTask(taskId) {
        tasks = tasks.filter(task => task.id !== taskId);
        saveTasks();
        renderTasks();
      }

      function clearCompleted() {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        renderTasks();
      }

      addBtn.addEventListener('click', addTask);

      taskInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          addTask();
        }
      });

      todoList.addEventListener('click', (event) => {
        const deleteBtn = event.target.closest('.delete-btn');
        if (deleteBtn) {
          deleteTask(Number(deleteBtn.dataset.id));
        }
      });

      todoList.addEventListener('change', (event) => {
        const checkbox = event.target.closest('.task-check');
        if (checkbox) {
          toggleTask(Number(checkbox.dataset.id));
        }
      });

      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          filterButtons.forEach(btn => btn.classList.toggle('active', btn === button));
          renderTasks();
        });
      });

      clearCompletedBtn.addEventListener('click', clearCompleted);

      renderTasks();
    </script>
  </body>
</html>
